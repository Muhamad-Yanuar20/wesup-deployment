steps:
    - name: Check out fork main
    uses: actions/checkout@v6
    with:
      repository: Muhamad-Yanuar20/wesup-deployment
      ref: main
      fetch-depth: 0
      path: fork

    - name: Check out private upstream main
    uses: actions/checkout@v6
    with:
      repository: ryan-gabriel/wesup
      ref: main
      fetch-depth: 0
      path: upstream
      token: ${{ secrets.UPSTREAM_TOKEN }}
      persist-credentials: false

    - name: Merge upstream main into fork
    working-directory: fork
    run: |
      git fetch ../upstream main:refs/remotes/upstream/main

      if git merge-base --is-ancestor upstream/main HEAD; then
        echo "Fork main already contains upstream main."
        exit 0
      fi

      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git merge --no-edit upstream/main
      git push origin HEAD:main
